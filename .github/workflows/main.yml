name: Build macOS Binary

on: 
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pip install
        run: |
          python -m pip install --upgrade pip
          pip install pygame-ce moderngl pyinstaller

      - name: PyInstaller build
        run: |
          pyinstaller --onefile --windowed --target-arch universal2 --collect-all moderngl --add-data "data:data" main.py

      - name: Ad-hoc Sign Binary
        run: |
          codesign --force --deep --sign - dist/main.app || true
      
      - name: Zip
        run: |
          zip -r Pygmy-MacOS.zip main.app

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Build
          path: dist/
